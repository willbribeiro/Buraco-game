name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MinGW-w64 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2

      - name: Configure
        run: cmake -S port -B port/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build port/build --parallel

      - name: Run unit tests
        run: ctest --test-dir port/build --output-on-failure

      - name: Headless smoke test
        run: |
          ./port/build/buraco.exe --check 500 --seed 4242 --out check500.txt
          grep -q '^OK steps=500' check500.txt

      - name: Assemble artifact
        if: github.event_name != 'pull_request'
        run: |
          cp /ucrt64/bin/SDL2.dll port/build/
          mkdir -p dist
          cp port/build/buraco.exe dist/
          cp port/build/*.dll dist/
          cp -r port/assets dist/assets

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: buraco-windows-x64
          path: dist/
          if-no-files-found: error
